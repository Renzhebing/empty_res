<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发票助手</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>
    <header class="app-header">
        <h1>发票助手</h1>
        <nav class="tabs">
            <button class="tab-btn active" data-tab="tab-import">导入</button>
            <button class="tab-btn" data-tab="tab-library">库</button>
            <button class="tab-btn" data-tab="tab-export">导出</button>
            <button class="tab-btn" data-tab="tab-debug">调试</button>
        </nav>
    </header>

    <main class="app-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
        <span id="status-line">就绪</span>
    </footer>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
